name: Mobile

# Checks on every push/PR. Store builds run only when you tag a release (v1.2.3) or start the
# workflow by hand, and need the EXPO_TOKEN repository secret (expo.dev -> Access tokens).
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        type: choice
        options: [android, ios, all]
        default: all

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run typecheck:test
      - name: Unit tests
        run: npm test --if-present

  build:
    needs: checks
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      # Signing keys live in EAS (managed credentials), never in this repo or on a laptop.
      - name: Build Android (Play bundle)
        if: github.event_name != 'workflow_dispatch' || inputs.platform != 'ios'
        run: eas build --platform android --profile production --non-interactive --no-wait
      - name: Build iOS (App Store)
        if: github.event_name != 'workflow_dispatch' || inputs.platform != 'android'
        run: eas build --platform ios --profile production --non-interactive --no-wait
